<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:h="http://java.sun.com/jsf/html"
>
    <c:if test="#{widget.mode != 'csv'}">
        <h:panelGroup
            layout="block"
            style="white-space: nowrap"
        >
            <h:outputText value="#{field_1}" />
            <h:graphicImage
                value="/icons/badge_current_10.png"
                alt="(#{messages['eloraplm.label.current']})"
                title="#{messages['eloraplm.label.current']}"
                style="margin-left: 5px"
                rendered="#{eloraPlmVersionHistoryActions.isCurrent(field_0, currentDocument)}"
            />
        </h:panelGroup>
    </c:if>

    <c:if test="#{widget.mode == 'csv'}">
        <h:outputText value="#{field_1}" />
        <h:outputText
            value=" (#{messages['eloraplm.label.current']})"
            rendered="#{eloraPlmVersionHistoryActions.isCurrent(field_0, currentDocument)}"
        />
    </c:if>
</ui:composition>
