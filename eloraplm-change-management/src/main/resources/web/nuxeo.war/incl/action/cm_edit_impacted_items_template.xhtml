<ui:decorate
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:a4j="http://richfaces.org/a4j"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/incl/action/widgets/primefaces_dialog_base_template.xhtml"
>
    <ui:define name="dialog_content">
        <h:panelGroup>
            <h:outputLabel value="#{messages['eloraplm.label.cm.process']}:" />
            <strong
                ><h:outputText
                    value="#{currentDocument.elo.reference} - #{currentDocument.title}"
            /></strong>
        </h:panelGroup>

        <br /><br />
        <ui:fragment
            rendered="#{treeBean.selectedNodes == null or fn:length(treeBean.selectedNodes) == 0}"
        >
            <p class="errorMessage">
                <h:outputText
                    value="#{messages['eloraplm.message.error.cm.editImpactedItems.emptyItemSelection']}"
                />
            </p>
        </ui:fragment>
        <ui:fragment
            rendered="#{treeBean.selectedNodes != null and fn:length(treeBean.selectedNodes) > 0}"
        >
            <!-- content -->
            <h:panelGroup>
                <table class="cmItemTable">
                    <!-- ################### action selection ################### -->
                    <tr>
                        <td class="labelColumn">
                            <strong
                                ><h:outputLabel
                                    value="#{messages['eloraplm.label.cm.action']}:"
                            /></strong>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="actionPanel">
                                <nxl:widgetType
                                    id="selImpactedItemAction"
                                    name="selectOneDirectory"
                                    mode="edit"
                                    value="#{treeBean.editAction}"
                                    directoryName="#{treeBean.itemType == 'BOM' ? 'elora_cmActionImpactedItem' : 'elora_cmActionImpactedCad'}"
                                    localize="true"
                                    displayIdAndLabel="false"
                                    ordering="ordering"
                                    style="min-width: 10em"
                                    notDisplayDefaultOption="true"
                                    required="false"
                                >
                                    <f:ajax render="isManagedPanel" />
                                    <f:selectItem
                                        itemValue="#{null}"
                                        itemLabel=""
                                    />
                                </nxl:widgetType>
                            </h:panelGroup>
                        </td>
                    </tr>

                    <!-- ################### isManaged selection ################### -->
                    <tr>
                        <td class="labelColumn">
                            <strong
                                ><h:outputLabel
                                    value="#{messages['eloraplm.label.cm.modifiableAttribute.isManaged']}:"
                            /></strong>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="isManagedPanel">
                                <h:selectOneMenu
                                    id="selIsManaged"
                                    value="#{treeBean.editIsManaged}"
                                    disabled="#{treeBean.editAction == 'id_ignore'}"
                                >
                                    <f:selectItem
                                        itemLabel="#{null}"
                                        itemValue=""
                                    />
                                    <f:selectItem
                                        itemLabel="#{messages['label.yes']}"
                                        itemValue="#{true}"
                                    />
                                    <f:selectItem
                                        itemLabel="#{messages['label.no']}"
                                        itemValue="#{false}"
                                    />
                                </h:selectOneMenu>
                            </h:panelGroup>
                        </td>
                    </tr>

                    <!-- ################### comment ################### -->
                    <tr>
                        <td class="labelColumn">
                            <strong
                                ><h:outputLabel
                                    value="#{messages['eloraplm.label.cm.modifiableAttribute.comment']}:"
                            /></strong>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="commentPanel">
                                <nxl:widgetType
                                    name="textarea"
                                    mode="edit"
                                    value="#{treeBean.editComment}"
                                />
                            </h:panelGroup>
                        </td>
                    </tr>
                </table>
            </h:panelGroup>
        </ui:fragment>
    </ui:define>

    <ui:define name="dialog_buttons">
        <p:commandButton
            id="modifyImpactedItemsAttributes"
            value="#{messages['command.edit']}"
            styleClass="button mainAction"
            action="#{treeBean.editImpactedItems}"
            disabled="#{treeBean.selectedNodes == null or fn:length(treeBean.selectedNodes) == 0}"
            onstart="handlePfDialogStart(#{pfDialogId});"
            oncomplete="handlePfDialogSuccessAndReloadAll(xhr, status, args, #{pfDialogId});"
            process="@form"
            update="@form"
        />

        <p:commandButton
            value="#{messages['command.cancel']}"
            actionListener="#{treeBean.resetEditImpactedItemsFormValues}"
            process="@form"
            styleClass="button"
            oncomplete="PF('#{pfDialogId}').hide();"
        />
    </ui:define>
</ui:decorate>
