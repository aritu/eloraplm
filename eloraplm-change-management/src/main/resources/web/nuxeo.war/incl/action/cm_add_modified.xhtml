<ui:decorate
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:a4j="http://richfaces.org/a4j"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/incl/action/widgets/primefaces_dialog_base_template.xhtml"
>
    <ui:define name="dialog_content">
        <!--  title -->
        <h:panelGroup>
            <h:outputLabel value="#{messages['eloraplm.label.cm.process']}:" />
            <strong
                ><h:outputText
                    value="#{currentDocument.elo.reference} - #{currentDocument.title}"
            /></strong>
        </h:panelGroup>

        <!--  content -->
        <h:panelGroup>
            <a4j:outputPanel>
                <br /><br />
                <table class="cmItemTable">
                    <!-- ################### origin item ################### -->
                    <tr>
                        <td class="labelColumn">
                            <strong
                                ><h:outputLabel
                                    value="#{messages['eloraplm.label.cm.origin']}:"
                            /></strong>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="originItemWcUidPanel">
                                <nxl:widgetType
                                    name="singleDocumentSuggestion"
                                    mode="edit"
                                    ajaxReRender="@form"
                                    value="#{cmModifiedsTreeBean}"
                                    field="originItemWcUid"
                                    translated="true"
                                    width="100%"
                                    placeholder="eloraplm.placeholder.suggestion.cm.originItem"
                                    pageProviderName="cad_bom_document_wc_suggestion"
                                    documentSchemas="dublincore,common,elora_object,template_info"
                                    required="true"
                                    additionalOperationParameters="eloraPassQueryTermsTwice"
                                >
                                </nxl:widgetType>
                                <h:message
                                    for="originItemWcUid"
                                    class="errorMessage"
                                    id="originItemWcUidMsg"
                                />
                            </h:panelGroup>

                            <h:panelGroup id="originItemVersionPanel">
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.originItemWcUid != null}"
                                >
                                    <c:choose>
                                        <c:when
                                            test="${cmModifiedsTreeBean.originItemVersionList != null and cmModifiedsTreeBean.originItemVersionList.size() > 0}"
                                        >
                                            <nxl:widget
                                                name="cm_add_modified_version_selector"
                                                mode="edit"
                                                value="#{cmModifiedsTreeBean}"
                                            />
                                        </c:when>
                                        <c:otherwise>
                                            <h:outputText
                                                value="#{messages['eloraplm.message.cm.addModifiedItem.emptyOriginItemVersionList']}"
                                                class="errorMessage"
                                            />
                                        </c:otherwise>
                                    </c:choose>
                                </ui:fragment>
                            </h:panelGroup>

                            <h:panelGroup id="originItemMsgPanel">
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.originItemMsg != null}"
                                >
                                    <h:outputText
                                        value="#{cmModifiedsTreeBean.originItemMsg}"
                                        class="errorMessage"
                                    />
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                    </tr>
                    <!-- ################### action selection ################### -->
                    <tr>
                        <td class="labelColumn">
                            <h:panelGroup id="actionPanelLabel">
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.originItem != null and cmModifiedsTreeBean.originItemMsg == null}"
                                >
                                    <strong
                                        ><h:outputLabel
                                            value="#{messages['eloraplm.label.cm.action']}:"
                                    /></strong>
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="actionPanel">
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.originItem != null and cmModifiedsTreeBean.originItemMsg == null}"
                                >
                                    <nxl:widgetType
                                        name="selectOneDirectory"
                                        mode="edit"
                                        value="#{cmModifiedsTreeBean.action}"
                                        directoryName="elora_cmActionModified"
                                        localize="true"
                                        displayIdAndLabel="false"
                                        ordering="ordering"
                                        style="min-width: 10em"
                                        notDisplayDefaultOption="true"
                                        required="true"
                                    >
                                        <p:ajax
                                            event="change"
                                            process="@this"
                                            partialSubmit="true"
                                            update="@form"
                                        />
                                    </nxl:widgetType>
                                </ui:fragment>
                            </h:panelGroup>

                            <h:panelGroup id="actionMsgPanel">
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.actionMsg != null}"
                                >
                                    <h:outputText
                                        value="#{cmModifiedsTreeBean.actionMsg}"
                                        class="errorMessage"
                                    />
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                    </tr>
                    <!--   ########### destination item ########### -->
                    <tr>
                        <td class="labelColumn">
                            <h:panelGroup id="destinationItemPanelLabel">
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.action != null and cmModifiedsTreeBean.actionMsg == null}"
                                >
                                    <strong
                                        ><h:outputLabel
                                            value="#{messages['eloraplm.label.cm.destination']}:"
                                    /></strong>
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="destinationItemPanel">
                                <!-- if action == replace, display destination item selection and destination item version selection -->
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.action != null and cmModifiedsTreeBean.actionMsg == null and cmModifiedsTreeBean.action eq 'id_replace'}"
                                >
                                    <nxu:set
                                        var="pageProviderName"
                                        value="#{cmModifiedsTreeBean.getPageProviderNameForAddModifiedItemReplaceDestinationItem()}"
                                    >
                                        <nxl:widgetType
                                            name="singleDocumentSuggestion"
                                            mode="edit"
                                            ajaxReRender="@form"
                                            value="#{cmModifiedsTreeBean}"
                                            field="destinationItemWcUid"
                                            translated="true"
                                            width="100%"
                                            placeholder="eloraplm.placeholder.suggestion.cm.destinationItem"
                                            pageProviderName="#{pageProviderName}"
                                            documentSchemas="dublincore,common,elora_object,template_info"
                                            required="true"
                                            additionalOperationParameters="eloraPassQueryTermsTwice"
                                        >
                                        </nxl:widgetType>
                                        <h:message
                                            for="destinationItemWcUid"
                                            class="errorMessage"
                                        />
                                    </nxu:set>
                                </ui:fragment>
                                <!-- if action != replace, display destination item in read mode -->
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.action != null and cmModifiedsTreeBean.actionMsg == null and not (cmModifiedsTreeBean.action eq 'id_replace') }"
                                >
                                    <nxl:widget
                                        name="cm_destination_item"
                                        mode="view"
                                        value="#{cmModifiedsTreeBean}"
                                    />
                                    <h:outputText value="&#160;&#160;&#160;" />
                                    <nxl:widget
                                        name="cm_destination_item_version"
                                        mode="view"
                                        value="#{cmModifiedsTreeBean}"
                                    />
                                    <h:outputText value="&#160;&#160;&#160;" />
                                    <nxl:widget
                                        name="cm_destination_item_state"
                                        mode="view"
                                        value="#{cmModifiedsTreeBean}"
                                    />
                                </ui:fragment>
                            </h:panelGroup>

                            <h:panelGroup id="destinationItemMsgPanel">
                                <ui:fragment
                                    rendered="#{cmModifiedsTreeBean.destinationItemMsg != null}"
                                >
                                    <h:outputText
                                        value="#{cmModifiedsTreeBean.destinationItemMsg}"
                                        class="errorMessage"
                                    />
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                    </tr>
                    <!--   ########### includeInImpactMatrix ########### -->
                    <tr>
                        <td class="labelColumn">
                            <h:panelGroup id="includeInImpactMatrixPanelLabel">
                                <ui:fragment
                                    rendered="#{(cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.action != null and cmModifiedsTreeBean.actionMsg == null and not (cmModifiedsTreeBean.action eq 'id_replace')) or 
                        (cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.actionMsg == null and cmModifiedsTreeBean.destinationItemWcUid != null and cmModifiedsTreeBean.destinationItemMsg == null)}"
                                >
                                    <strong
                                        ><h:outputLabel
                                            value="#{messages['eloraplm.label.cm.includeInImpactMatrix']}:"
                                    /></strong>
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="includeInImpactMatrixPanel">
                                <ui:fragment
                                    rendered="#{(cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.action != null and cmModifiedsTreeBean.actionMsg == null and not (cmModifiedsTreeBean.action eq 'id_replace')) or 
                        (cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.actionMsg == null and cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.destinationItemWcUid != null and cmModifiedsTreeBean.destinationItemMsg == null)}"
                                >
                                    <ui:fragment
                                        rendered="#{not cmModifiedsTreeBean.isImpactable}"
                                    >
                                        <h:outputText
                                            value="#{cmModifiedsTreeBean.includeInImpactMatrix ? messages['label.yes'] : messages['label.no']}"
                                        />
                                    </ui:fragment>
                                    <ui:fragment
                                        rendered="#{cmModifiedsTreeBean.isImpactable}"
                                    >
                                        <nxl:widgetType
                                            mode="edit"
                                            name="checkbox"
                                            value="#{cmModifiedsTreeBean.includeInImpactMatrix}"
                                        />
                                    </ui:fragment>
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                    </tr>
                    <!--   ########### comment ########### -->
                    <tr>
                        <td class="labelColumn">
                            <h:panelGroup id="commentPanelLabel">
                                <ui:fragment
                                    rendered="#{(cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.action != null and cmModifiedsTreeBean.actionMsg == null and not (cmModifiedsTreeBean.action eq 'id_replace')) or 
                        (cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.actionMsg == null and cmModifiedsTreeBean.destinationItemWcUid != null and cmModifiedsTreeBean.destinationItemMsg == null)}"
                                >
                                    <strong
                                        ><h:outputLabel
                                            value="#{messages['eloraplm.label.cm.comment']}:"
                                    /></strong>
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                        <td class="fieldColumn">
                            <h:panelGroup id="commentPanel">
                                <ui:fragment
                                    rendered="#{(cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.action != null and cmModifiedsTreeBean.actionMsg == null and not (cmModifiedsTreeBean.action eq 'id_replace')) or 
                        (cmModifiedsTreeBean.originItemMsg == null and cmModifiedsTreeBean.actionMsg == null and cmModifiedsTreeBean.destinationItemWcUid != null and cmModifiedsTreeBean.destinationItemMsg == null)}"
                                >
                                    <nxl:widgetType
                                        name="textarea"
                                        mode="edit"
                                        value="#{cmModifiedsTreeBean.comment}"
                                    />
                                </ui:fragment>
                            </h:panelGroup>
                        </td>
                    </tr>
                </table>
            </a4j:outputPanel>
        </h:panelGroup>

        <h:outputScript rendered="#{cmModifiedsTreeBean.originItem != null}">
            // If origin item is selected, reset dialog position
            if(PF('#{pfDialogId}')) { PF('#{pfDialogId}').resetPosition(); }
        </h:outputScript>
    </ui:define>

    <ui:define name="dialog_buttons">
        <p:commandButton
            value="#{messages['command.add']}"
            styleClass="button mainAction"
            action="#{cmModifiedsTreeBean.addModifiedItem}"
            disabled="#{not cmModifiedsTreeBean.isValid}"
            onstart="handlePfDialogStart(#{pfDialogId});"
            oncomplete="handlePfDialogSuccessAndReloadAll(xhr, status, args, #{pfDialogId});"
            process="@form"
            update="@form"
        >
        </p:commandButton>

        <p:commandButton
            type="button"
            value="#{messages['command.cancel']}"
            immediate="true"
            process="@none"
            styleClass="button"
            onclick="PF('#{pfDialogId}').hide();"
        />
    </ui:define>
</ui:decorate>
