<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:p="http://primefaces.org/ui"
>
    <c:if
        test="#{webActions.currentTabId eq 'TAB_CM_MODIFIED_ITEMS_TREETABLE'}"
    >
        <p:ajax
            event="change"
            listener="#{cmModifiedsTreeBean.refreshNode(component.namingContainer, node, 'destinationItem', false)}"
            process="@this"
            partialSubmit="true"
            onstart="preparePartialAjaxUpdate(cfg.source)"
            onsuccess="markTreeNodeAsModified(#{false})"
        />
    </c:if>

    <c:if
        test="#{webActions.currentTabId eq 'TAB_CM_DOC_IMPACTED_ITEMS_TREETABLE'}"
    >
        <p:ajax
            event="change"
            listener="#{cmDocImpactedItemsTreeBean.refreshNode(component.namingContainer, node, 'destinationItem', false)}"
            process="@this"
            partialSubmit="true"
            onstart="preparePartialAjaxUpdate(cfg.source)"
            onsuccess="markTreeNodeAsModified(#{false})"
        />
    </c:if>

    <c:if
        test="#{webActions.currentTabId eq 'TAB_CM_BOM_IMPACTED_ITEMS_TREETABLE'}"
    >
        <p:ajax
            event="change"
            listener="#{cmBomImpactedItemsTreeBean.refreshNode(component.namingContainer, node, 'destinationItem', false)}"
            process="@this"
            partialSubmit="true"
            onstart="preparePartialAjaxUpdate(cfg.source)"
            onsuccess="markTreeNodeAsModified(#{false})"
        />
    </c:if>
</ui:composition>
