<ui:fragment
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
    xmlns:nxu="http://nuxeo.org/nxweb/util">

    <c:set var="hasCadDerivedOutputs" value="#{currentDocument.hasFacet('CadDocument') and !empty currentDocument.cad.derivedOutputs}" />
    
    <!-- CAD Derived outputs -->
    <c:if test="#{hasCadDerivedOutputs}">
        <div class="#{fileZoneClass}" context="cadDerivedOutputs" id="cadDerivedOutputsDropZone">
            <table class="smallTable">
                <tbody>
                <c:forEach items="#{currentDocument.cad.derivedOutputs}" varStatus="loop">
                    <tr>
                        <td class="labelColumn">
                            <h:outputText value=" #{messages['eloraplm.label.summary.download.cad.derivedOutputs']}" rendered="#{loop.index == 0}" />
                        </td>
                        <td class="fieldColumn">
                            <nxl:widgetType name="cadDerivedOutput" mode="view" value="#{currentDocument}" field="#{loop.index}" />
                        </td>
                    </tr>
                </c:forEach>
                </tbody>
            </table>
        </div>
    </c:if>

</ui:fragment>
