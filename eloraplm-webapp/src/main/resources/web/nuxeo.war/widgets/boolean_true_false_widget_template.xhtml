<f:subview xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://java.sun.com/jsf/core"
  xmlns:h="http://java.sun.com/jsf/html"
  xmlns:c="http://java.sun.com/jstl/core"
  id="#{widget.id}">

  <c:if test="#{widget.mode == 'edit'}">
    <h:selectOneRadio value="#{field}" id="#{widget.id}_checkbox" disabled="#{widgetProperty_disabled}" required="#{widgetProperty_required}">
      <f:selectItem itemValue="#{true}" itemLabel="#{messages['label.true']}" />
      <f:selectItem itemValue="#{false}" itemLabel="#{messages['label.false']}" />
    </h:selectOneRadio>
    <h:message styleClass="errorMessage" for="#{widget.id}_checkbox"
      id="#{widget.id}_message" />
  </c:if>
  <c:if test="#{widget.mode == 'view' }">
    <h:outputText rendered="#{not empty field and field}" value="#{messages['label.true']}" />
    <h:outputText rendered="#{not empty field and !field}" value="#{messages['label.false']}" />
  </c:if>
  <c:if test="#{widget.mode == 'csv' }">
      <h:outputText value="#{field ? messages['label.true'] : messages['label.false']}" rendered="#{not empty field}" />
  </c:if>

</f:subview>
