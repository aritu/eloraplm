<f:subview
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
>
    <h:panelGroup
        rendered="#{empty widget.properties.visible or eloraWebActions.evaluateBoolean(widget.properties.visible)}"
    >
        <ui:remove><!-- EDIT MODE --></ui:remove>
        <c:if test="#{widget.mode == 'edit'}">
            <h:panelGroup
                rendered="#{empty widget.properties.editable or eloraWebActions.evaluateBoolean(widget.properties.editable)}"
            >
                <h:inputText
                    id="value_field"
                    value="#{field}"
                    styleClass="#{eloraWebActions.evaluateString(widget.properties.styleClass)}"
                    style="#{widget.properties.style}"
                >
                    <c:if test="#{widget.properties.required}">
                        <f:validateRequired />
                    </c:if>

                    <c:if
                        test="#{not empty widget.properties.templateForListener}"
                    >
                        <ui:include
                            src="#{widget.properties.templateForListener}"
                        />
                    </c:if>
                </h:inputText>

                <h:message
                    for="value_field"
                    styleClass="errorMessage"
                />
            </h:panelGroup>

            <!-- Even if widget mode is EDIT, if editable property resolves to false, we show it in VIEW mode -->
            <h:panelGroup
                rendered="#{not empty widget.properties.editable and not eloraWebActions.evaluateBoolean(widget.properties.editable)}"
            >
                <h:outputText value="#{field}" />
            </h:panelGroup>
        </c:if>

        <ui:remove><!-- VIEW MODE --></ui:remove>
        <c:if test="#{widget.mode == 'view'}">
            <h:outputText value="#{field}" />
        </c:if>

        <ui:remove><!-- CSV MODE --></ui:remove>
        <c:if test="#{widget.mode == 'csv'}">
            <h:outputText value="#{field}" />
        </c:if>
    </h:panelGroup>
</f:subview>
