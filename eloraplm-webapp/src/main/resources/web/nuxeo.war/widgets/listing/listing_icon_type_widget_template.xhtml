<f:subview id="#{widget.id}"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:nxd="http://nuxeo.org/nxweb/document"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:nxp="http://nuxeo.org/nxweb/pdf"
    xmlns:ui="http://java.sun.com/jsf/facelets">
    
    <nxu:set var="typeLabel" value="#{nxd:typeLabel(field)}">
    <nxu:set var="label" value="#{empty typeLabel ? messages[field_2] : messages[typeLabel]}">
        
        <c:if test="#{nxl:isLikePlainMode(widget.mode)}">#{label}</c:if>
        <c:if test="#{nxl:isLikeViewMode(widget.mode)}">
            
            <div id="docRefTarget:#{field_1}"
                class="#{nxu:test(field_3, 'nxDropTarget', '')}">
                
                <nxu:graphicImage value="/icons/badge_proxy_12.png"
                    styleClass="proxyBadge" rendered="#{field_0.isProxy()}"/>
                
                <nxu:graphicImage value="/icons/badge_template_12.png"
                    styleClass="templateBadge" rendered="#{eloraDocumentTemplatesActions.isTemplate(field_0)}"/>
                
                    <nxu:set var="sourceDocument" value="#{eloraDocument.getNonProxyDocument(field)}">
                    <nxu:set var="docCanBeReached" value="#{sourceDocument != null and nxd:hasPermission(sourceDocument, 'Read')}">
                    <ui:fragment rendered="#{docCanBeReached}">
                        <div id="docRef:#{field_1}"
                        class="documentIcon cell popupTarget"
                        docRef="#{field_1}">
                        <nxu:graphicImage
                            value="#{nxd:iconPath(field_0)}" alt="#{label}" title="#{label}"
                            rendered="#{!empty nxd:iconPath(field_0)}"
                            styleClass="smallIcon" />
                        </div>
                    </ui:fragment>
                    
                    <ui:fragment rendered="#{!docCanBeReached}">
                        <div class="documentIcon cell">
                        <nxu:graphicImage
                            value="#{nxd:iconPath(field_0)}" alt="#{label}" title="#{label}"
                            rendered="#{!empty nxd:iconPath(field_0)}"
                            styleClass="smallIcon" />
                        </div>
                    </ui:fragment>
                    </nxu:set>
                    </nxu:set>
                
            </div>
        </c:if>
        
        <c:if test="#{widget.mode == 'pdf'}">
            <nxp:html>
                <nxu:graphicImage
                    value="#{nxd:iconPath(field_0)}" alt="#{label}" title="#{label}"
                    rendered="#{!empty nxd:iconPath(field_0)}"
                    styleClass="smallIcon" />
            </nxp:html>
        </c:if>
        
    </nxu:set>
    </nxu:set>
</f:subview>
