<f:subview id="#{widget.id}"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:nxd="http://nuxeo.org/nxweb/document"
    xmlns:nxh="http://nuxeo.org/nxweb/html"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:ui="http://java.sun.com/jsf/facelets">

    <nxu:set var="wcDoc" value="#{eloraDocument.getWorkingCopy(fieldOrValue)}">
        <ui:fragment rendered="#{wcDoc != null}">
            <nxh:outputLink
                rendered="#{field_0.hasSchema(widget.properties.file_schema) and !empty field_1}"
                value="#{nxd:fileUrl('downloadFile', field_0, widget.properties.file_property_name, field_2)}"
                styleClass="listing-icon-button">
                <nxh:graphicImage value="/icons/row_download_16.png"
                    title="#{nxd:fileDescription(field_0, widget.properties.file_property_name, widget.properties.filename_property_name, field_2)}"
                    alt="#{nxd:fileDescription(field_0, widget.properties.file_property_name, widget.properties.filename_property_name, field_2)}" />
            </nxh:outputLink>
        </ui:fragment>
    </nxu:set>
    
</f:subview>
