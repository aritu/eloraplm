<ui:fragment
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:p="http://primefaces.org/ui"
>
    <header class="nxHeader">
        <div class="logo">
            <ui:include src="/incl/nuxeo_logo.xhtml" />
        </div>
        <div class="content">
            <ui:include src="/incl/nuxeo_header.xhtml" />
        </div>
        <div class="includes displayNone">
            <ui:insert name="page body includes" />
        </div>
    </header>
    <section class="nxMainContainer">
        <!-- Global PF Tooltip -->
        <p:tooltip />
        <!-- Global Blocker -->
        <p:remoteCommand
            name="updateNxMainContainer"
            onstart="PF('globalBlocker').show()"
            oncomplete="PF('globalBlocker').hide()"
            update="nxMainContainer"
        />
        <h:panelGroup id="nxMainContainer">
            <ui:remove
                ><!-- Blocker to simulate modal dialogs when real modal breaks dialog content --></ui:remove
            >
            <p:blockUI
                widgetVar="falseModal"
                block="nxMainContainer"
                animate="false"
            />

            <p:blockUI
                widgetVar="globalBlocker"
                block="nxMainContainer"
                animate="false"
                styleClass="globalBlockUI"
            >
                <h:graphicImage url="/img/standart_waiter.gif" />
            </p:blockUI>

            <!-- PrimeFaces global dialog -->
            <ui:include
                src="/incl/action/widgets/global_primefaces_dialog_template.xhtml"
            />

            <ui:insert name="main content" />
        </h:panelGroup>
    </section>
    <footer class="nxFooter">
        <div class="content">
            <ui:include src="/incl/nuxeo_footer.xhtml" />
        </div>
    </footer>
</ui:fragment>
