<ui:composition
    template="basic_page.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:p="http://primefaces.org/ui"
>
    <ui:param
        name="pageName"
        value="#{themeActions.currentPage}"
    />
    <ui:param
        name="pageFlavor"
        value="#{themeActions.currentFlavor}"
    />

    <ui:define name="basic body includes">
        <ui:include src="/incl/includes.xhtml" />
    </ui:define>

    <ui:define name="basic body">
        <ui:decorate template="/pages/header_footer_template.xhtml">
            <ui:define name="main content">
                <ui:include src="/incl/sidebar.xhtml" />

                <div class="content ws_content">
                    <ui:include src="/incl/breadcrumb.xhtml" />
                    <ui:insert name="body" />
                </div>
                <div class="clear" />
            </ui:define>
        </ui:decorate>
    </ui:define>
</ui:composition>
