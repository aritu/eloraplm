<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui">
    
    <p:triStateCheckbox>
        <f:converter converterId="triStateBooleanConverter" />
        <p:ajax event="change"
            partialSubmit="true"
            process="@this"
            oncomplete="PF('#{treeWidgetId}').filter()"/>
     </p:triStateCheckbox>
</ui:composition>
