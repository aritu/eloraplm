<div xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:h="http://java.sun.com/jsf/html"
  xmlns:c="http://java.sun.com/jstl/core"
  xmlns:nxu="http://nuxeo.org/nxweb/util">

    <nxu:set var="previewUrl" value="#{eloraPreviewActions.getPreviewUrl(currentDocument)}">
    <c:if test="#{not empty previewUrl}">
        <h:panelGroup>
          <iframe src="#{previewUrl}" frameborder="1" height="600px" width="100%" scrolling="auto" id="preview-frame">
          </iframe>
    
          <script type="text/javascript">
            jQuery(document).ready(function() {
              var fancyBox = jQuery('#fancybox-content', window.parent.document);
              if (fancyBox.length > 0 &amp;&amp; fancyBox.height() > 0) {
                // we know we are in a fancybox
                jQuery('#preview-frame').height(fancyBox.height() - 20);
              }
            });
          </script>
        </h:panelGroup>
    </c:if>
    </nxu:set>

</div>
