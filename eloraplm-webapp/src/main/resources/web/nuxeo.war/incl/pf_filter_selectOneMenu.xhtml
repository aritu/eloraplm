<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:nxu="http://nuxeo.org/nxweb/util">

    <p:selectOneMenu styleClass="#{styleClass}">
        <p:ajax event="change" process="@this" partialSubmit="true" oncomplete="PF('#{treeWidgetId}').filter();" />
        <f:selectItem itemLabel="" itemValue="#{null}" />
        <nxu:selectItems value="#{map}" var="item" itemValue="#{item.value}" itemLabel="#{messages[item.key]}" />
    </p:selectOneMenu>

</ui:composition>
