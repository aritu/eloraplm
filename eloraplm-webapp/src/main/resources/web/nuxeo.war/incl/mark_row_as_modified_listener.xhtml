<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:p="http://primefaces.org/ui"
>
    <p:ajax
        event="change"
        listener="#{layoutValue.markRowAsModified(rowData, rowIndex)}"
        process="@this"
        partialSubmit="true"
        update="@form:dt:@row(#{rowIndex})"
        onstart="prepareTablePartialAjaxUpdate(cfg.source.id)"
        onsuccess="markRowAsModified()"
    />
</ui:composition>
