<ui:composition template="/pages/workspace_page.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="page title">
        <h:outputText value="#{nuxeoApplicationName} - #{messages['eloraplm.title.duplicate.document']}" />
    </ui:define>
    
    <ui:define name="body">
        <div class="mainNoTabs">
            <h3>
                <h:outputText value="#{messages['eloraplm.title.duplicate.document']}: #{not empty currentDocument.elo.reference ? currentDocument.elo.reference.concat(' - ') : ''}#{currentDocument.dc.title}" />
            </h3>
            <ui:include src="/incl/message_banner.xhtml" />
            
            <h:form enctype="multipart/form-data" id="document_create">
                <h:outputScript target="#{pageJsTarget}">
                    jQuery(document).ready(function() {
                        jQuery('#document_create').focusFirst();
                    });
                </h:outputScript>
                
                <div id="document_duplicate_inner_form">
                    <nxl:documentLayout mode="create" value="#{changeableDocument}" />
                </div>
                
                <div class="buttonsGadget">
                    <input type="hidden" name="parentDocumentPath" value="#{eloraDocument.getNonProxyDocument(currentDocument).pathAsString}" />
                    <nxl:widget name="documentDuplicatingButtons" mode="view" value="#{changeableDocument}" />
                </div>
            </h:form>
        </div>
    </ui:define>
    
</ui:composition>
