<ui:decorate
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
    template="/incl/action/widgets/primefaces_dialog_base_template.xhtml"
>
    <ui:define name="dialog_content">
        <nxl:layout
            name="workflow_question"
            mode="create"
            value="#{workflowQuestionsTableBean}"
        />
    </ui:define>

    <ui:define name="dialog_buttons">
        <p:commandButton
            value="#{messages['command.add']}"
            onstart="handlePfDialogStart(#{pfDialogId});"
            oncomplete="handlePfDialogSuccess(xhr, status, args, #{pfDialogId});"
            styleClass="button mainAction"
            actionListener="#{workflowQuestionsTableBean.addRow()}"
            process="@form"
            update="@form :nxw_workflow_questions_dt:dtForm"
        />

        <p:commandButton
            type="button"
            value="#{messages['command.cancel']}"
            immediate="true"
            process="@none"
            styleClass="button"
            onclick="PF('#{pfDialogId}').hide();"
        />
    </ui:define>

    <ui:define name="dialog_scripts">
        <script>
            function onQuestionTypeChanged(xhr, status, args, dialog) {
                PF(dialog.id).resetPosition();
            }
        </script>
    </ui:define>
</ui:decorate>
