<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
>
    <c:forEach
        var="type"
        items="#{workflowFormActions.getFieldTypes()}"
    >
        <h:panelGroup rendered="#{field_3 eq type.key}">
            <nxl:widget
                name="#{'workflow_question_type_'.concat(type.key)}"
                mode="#{widget.mode}"
                value="#{field_0}"
            />
        </h:panelGroup>
    </c:forEach>
</ui:composition>
