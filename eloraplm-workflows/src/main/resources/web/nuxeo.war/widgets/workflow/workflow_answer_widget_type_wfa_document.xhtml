<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:nxd="http://nuxeo.org/nxweb/document"
>
    <nxu:set
        var="doc"
        value="#{eloraWebActions.getDocumentFromId(field_0)}"
    >
        <c:if test="#{widget.mode != 'csv'}">
            <nxu:graphicImage
                value="#{nxd:iconPath(doc)}"
                alt="#{messages[doc.type]}"
                title="#{messages[doc.type]}"
                styleClass="smallIcon"
            />
            <nxd:restDocumentLink
                document="#{doc}"
                class="documentTitleLink"
            >
                <span class="eloraReference"> #{doc.elo.reference} </span>
                <h:outputText value="#{doc.title}" />
            </nxd:restDocumentLink>
        </c:if>
        <c:if test="#{widget.mode == 'csv'}">
            <h:outputText value="#{doc.elo.reference} " />
            <h:outputText value="#{doc.title}" />
        </c:if>
    </nxu:set>
</ui:composition>
