<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://java.sun.com/jsf/html"
>
    <strong>#{messages['eloraplm.label.relations.showLabel']}:</strong>
    <h:selectBooleanCheckbox
        id="showUniqueVersionsPerDocument"
        value="#{value.showUniqueVersionsPerDocument}"
    >
        <p:ajax
            update="@form"
            process="@this"
            partialSubmit="true"
            listener="#{value.reloadTree(component.namingContainer)}"
            onstart="PF('#{treeBlockerId}').show();"
            onsuccess="PF('#{treeBlockerId}').hide();"
        />
    </h:selectBooleanCheckbox>

    <h:outputLabel
        for="showUniqueVersionsPerDocument"
        value="#{messages['eloraplm.label.relations.showUniqueVersionsPerDocument']}"
    />

    <h:selectBooleanCheckbox
        id="showObsoleteStateDocuments"
        value="#{value.showObsoleteStateDocuments}"
    >
        <p:ajax
            update="@form"
            process="@this"
            partialSubmit="true"
            listener="#{value.reloadTree(component.namingContainer)}"
            onstart="PF('#{treeBlockerId}').show();"
            onsuccess="PF('#{treeBlockerId}').hide();"
        />
    </h:selectBooleanCheckbox>

    <h:outputLabel
        for="showObsoleteStateDocuments"
        value="#{messages['eloraplm.label.relations.showObsoleteStateDocuments']}"
    />

    <p:divider
        layout="vertical"
        style="display: inline; padding: 0.4rem 0"
    />
</ui:composition>
