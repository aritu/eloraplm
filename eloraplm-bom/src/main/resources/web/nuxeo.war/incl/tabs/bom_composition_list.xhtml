<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:nxu="http://nuxeo.org/nxweb/util"
    xmlns:nxdir="http://nuxeo.org/nxdirectory"
    xmlns:nxl="http://nuxeo.org/nxforms/layout"
>
    <h:panelGrid
        styleClass="summary"
        style="margin-bottom: 1em"
        columns="2"
    >
        <h:panelGroup layout="block">
            <h:outputLabel
                value="#{messages['label.content.header.description']}"
                styleClass="labelColumn"
            />
        </h:panelGroup>
        <h:panelGroup layout="block">
            <h:outputText
                value="#{bomList.description}"
                styleClass="fieldColumn"
            />
        </h:panelGroup>

        <h:panelGroup layout="block">
            <h:outputLabel
                value="#{messages['label.content.header.type']}"
                styleClass="labelColumn"
            />
        </h:panelGroup>
        <h:panelGroup layout="block">
            <nxu:set
                var="bomListTypeVoc"
                value="#{nxdir:directoryEntry('elora_bom_list_types', bomList.type)}"
            >
                <h:outputText
                    value="#{messages[bomListTypeVoc.vocabulary.label]}"
                    styleClass="fieldColumn"
                />
            </nxu:set>
        </h:panelGroup>
    </h:panelGrid>

    <c:if test="#{not bomList.isListCreated}">
        <h:form>
            <h:panelGroup styleClass="bubbleBox">
                <h3 class="bubbleHeader">
                    #{messages['eloraplm.title.bom.list.notCreated']}
                </h3>

                <h:panelGroup styleClass="boxBody">
                    <h:outputFormat
                        value="#{messages['eloraplm.label.bom.list.notCreated']} "
                    >
                        <f:param value="#{bomList.label}" />
                    </h:outputFormat>
                    <h:panelGroup
                        rendered="#{not currentDocument.isImmutable()}"
                    >
                        <h:outputText
                            value="#{messages['eloraplm.label.bom.list.confirmCreate']} "
                        />
                        &#160;&#160;
                        <p:commandButton
                            value="#{messages['command.create']}"
                            styleClass="button"
                            actionListener="#{bomList.createList}"
                            process="@form"
                            partialSubmit="true"
                            update="@none"
                            onsuccess="updateNxMainContainer()"
                        />
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>
    </c:if>

    <c:if test="#{bomList.isListCreated}">
        <h:panelGroup
            styleClass="textAlignC displayB"
            style="margin-bottom: 15px"
        >
            <c:if
                test="#{nxd:hasPermission(currentDocument, 'Write') and not currentDocument.isVersion() and not currentDocument.isProxy()}"
            >
                <c:if
                    test="#{currentDocument.locked and !(currentDocumentLockDetails['document.locker'] eq currentUser)}"
                >
                    <h:outputText
                        value="#{messages['eloraplm.message.warning.relations.edit.documentLockedByOther']}"
                        class="processMessage completeWarning"
                    />
                </c:if>
            </c:if>
        </h:panelGroup>

        <nxl:widget
            name="bom_comp_list_tt"
            mode="edit"
            value="#{bomCompositionListTreeBean}"
        />
    </c:if>
</ui:composition>
